# 抖音视频下载器配置文件

# 用户主页链接（可以在这里配置，也可以通过命令行参数 -u 指定）
url: ""

# 下载保存路径
path: "./Downloaded"

# 最大下载数量（0 表示不限制，下载所有视频）
max_count: 0

# 视频下载顺序
# true: 从最老的视频开始下载（推荐，按时间顺序）
# false: 从最新的视频开始下载
oldest_first: true

# Cookie（重要！必需的，用于获取视频列表）
# 获取方式：
# 1. 在浏览器中打开 https://www.douyin.com 并登录
# 2. 按 F12 打开开发者工具
# 3. 切换到 Network 标签
# 4. 刷新页面（F5）
# 5. 找到任意请求，在 Request Headers 中找到 Cookie
# 6. 复制整个 Cookie 值到下面
# 详细教程：查看 COOKIE_GUIDE.md
cookie: ""
