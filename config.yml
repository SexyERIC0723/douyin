# 抖音视频下载器配置文件

# 用户主页链接（可以在这里配置，也可以通过命令行参数 -u 指定）
url: ""

# 下载保存路径
path: "./Downloaded"

# 最大下载数量（0 表示不限制，下载所有视频）
max_count: 0

# Cookie（可选，某些情况下需要登录才能获取视频列表）
# 获取方式：
# 1. 在浏览器中打开 https://www.douyin.com
# 2. 按 F12 打开开发者工具
# 3. 切换到 Network 标签
# 4. 刷新页面
# 5. 找到任意请求，在 Request Headers 中找到 Cookie
# 6. 复制整个 Cookie 值到下面
cookie: ""
